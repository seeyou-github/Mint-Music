name: Build Android (arm-v8a)-debug

on:
  workflow_dispatch:

jobs:
  build-android-arm-v8a:
    name: Build Android arm-v8a APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 必须显式钉 JDK：GitHub 的 ubuntu-latest 已切到 Ubuntu 26.04，默认
      # JAVA_HOME 是 JDK 25，而本项目的 Gradle 8.14 无法在 Java 25 上编译
      # Kotlin DSL 脚本，报错只会在 "What went wrong:" 后面打一个裸版本号
      # （25.0.5），完全看不出原因。JDK 17 是 AGP 8.6 的基线版本。
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 与 Windows 工作流保持一致，钉死版本避免 stable 漂移引入 Android
          # 工具链变量（AGP / Gradle / JDK 兼容性此前反复出过问题）。
          # 3.47.7 = 当前 stable 最新，Dart 3.13.5。
          flutter-version: 3.47.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 不要加 --split-per-abi：Flutter 在分 ABI 打包时会把每个 APK 的
      # versionCode 改成 `abi * 1000 + 基础值`（arm64 → 20263111），
      # 与 build.gradle.kts 里固定的 20261111 对不上。
      - name: Build Android APK (arm-v8a only)
        run: flutter build apk --debug --target-platform android-arm64 --android-skip-build-dependency-validation

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mintmusic-android-arm64-v8a
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 3
          if-no-files-found: error
